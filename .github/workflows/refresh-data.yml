
name: Refresh WoA Intelligence Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: woa-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build complete data snapshot
        run: python scripts/refresh_woa_data.py

      - name: Commit only if data changed
        shell: bash
        run: |
          if git diff --quiet -- data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "WoA Intelligence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh WoA intelligence data"
          git push
